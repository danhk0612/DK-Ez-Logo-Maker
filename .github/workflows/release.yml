name: Release v1.0.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release v1.0.0]')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64
        shell: pwsh
        run: |
          dotnet restore DK.EzLogoMaker.csproj
          dotnet publish DK.EzLogoMaker.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o publish/win-x64

      - name: Create release package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath DK-Ez-Logo-Maker-v1.0.0-win-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          ## DK Ez Logo Maker 1.0.0

          첫 정식 배포 버전입니다.

          ### 주요 기능
          - 투명 / 단색 / 그라디에이션 배경
          - 글자 폰트·크기·굵기·자간·색상 편집
          - 이미지 이동·자유 크기 조절 및 비율 유지 옵션
          - 글자·이미지 가로/세로 정렬
          - 미리보기 확대·축소·맞춤·1:1
          - 마우스 드래그 및 테두리/모서리 크기 조절
          - 요소별 우클릭 빠른 설정
          - PNG 출력 배율 및 스케일링 방식 선택
          - `.dklm` 작업 저장/불러오기
          - 최근 편집 및 창 설정 자동 유지

          ### 실행 환경
          - Windows 10/11 64-bit
          - .NET 10 Desktop Runtime 필요
          "@ | Set-Content -Path release-notes.md -Encoding utf8

          gh release create v1.0.0 `
            DK-Ez-Logo-Maker-v1.0.0-win-x64.zip `
            --target "$env:GITHUB_SHA" `
            --title "DK Ez Logo Maker 1.0.0" `
            --notes-file release-notes.md
